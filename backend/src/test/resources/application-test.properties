# Test Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/jobportal_test
spring.data.mongodb.auto-index-creation=true

# JWT Settings for testing
jwt.secret=test-secret-key-for-testing-purposes-only-minimum-256-bits-long
jwt.expiration=3600000

# Disable actual file uploads in tests
file.upload-dir=target/test-uploads

# Logging
logging.level.com.jobportal=DEBUG
logging.level.org.springframework.security=DEBUG
