# Render Blueprint - Backend Only
# Frontend should be deployed separately as a Static Site in Render dashboard

services:
  # Backend - Spring Boot API
  - type: web
    name: jobportal-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: SPRING_PROFILES_ACTIVE
        value: production
    healthCheckPath: /api/health
